name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fingerprint-tests:
    name: JA4 regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run measured-fixture tests
        run: python3 tests/test_fingerprints.py

  patch-applies:
    name: Chromium 156 patch applies
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: refs/tags/156.0.8078.47
            label: 156.0.8078.47
          - ref: main
            label: main
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the one file the patch touches
        run: |
          set -euo pipefail
          mkdir -p src/net/socket
          curl -fsSL "https://chromium.googlesource.com/chromium/src/+/${{ matrix.ref }}/net/socket/ssl_client_socket_impl.cc?format=TEXT" \
            | base64 -d > src/net/socket/ssl_client_socket_impl.cc
          wc -l src/net/socket/ssl_client_socket_impl.cc
      - name: Apply patches/chromium-no-mldsa-sigalgs.patch
        run: |
          set -euo pipefail
          cd src
          patch -p1 --dry-run < ../patches/chromium-no-mldsa-sigalgs.patch
          patch -p1 < ../patches/chromium-no-mldsa-sigalgs.patch
      - name: Assert ML-DSA sigalgs are gone and the rest survived
        run: |
          set -euo pipefail
          f=src/net/socket/ssl_client_socket_impl.cc
          if grep -q "SSL_SIGN_ML_DSA" "$f"; then
            echo "::error::ML-DSA sigalgs still present"; exit 1
          fi
          for sig in SSL_SIGN_ECDSA_SECP256R1_SHA256 SSL_SIGN_RSA_PSS_RSAE_SHA256 \
                     SSL_SIGN_RSA_PKCS1_SHA512; do
            grep -q "$sig" "$f" || { echo "::error::lost $sig"; exit 1; }
          done
          # the array must still be well formed
          python3 - <<'CHECK'
          import re, pathlib
          src = pathlib.Path("src/net/socket/ssl_client_socket_impl.cc").read_text()
          m = re.search(r"kVerifyPrefs\[\] = \{(.*?)\};", src, re.S)
          assert m, "kVerifyPrefs array missing"
          entries = [x.strip() for x in m.group(1).split(",") if x.strip()]
          assert len(entries) == 8, f"expected 8 sigalgs, got {len(entries)}: {entries}"
          print("kVerifyPrefs:", entries)
          CHECK
          echo "patch verified on ${{ matrix.label }}"

  gles2-patch-applies:
    name: chromium GLES2 allow-list patch applies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch x11_surface_factory.cc
        run: |
          set -euo pipefail
          mkdir -p src/ui/ozone/platform/x11
          curl -fsSL "https://chromium.googlesource.com/chromium/src/+/refs/tags/156.0.8078.47/ui/ozone/platform/x11/x11_surface_factory.cc?format=TEXT" \
            | base64 -d > src/ui/ozone/platform/x11/x11_surface_factory.cc
          wc -l src/ui/ozone/platform/x11/x11_surface_factory.cc
      - name: Apply and assert GLES2 is allowed
        run: |
          set -euo pipefail
          cd src
          patch -p1 < ../patches/chromium-allow-gles2.patch
          grep -q "kGLImplementationEGLGLES2" ui/ozone/platform/x11/x11_surface_factory.cc
          echo "GLES2 now allowed alongside ANGLE"

  human-trajectory:
    name: human drag trajectory stays in the human band
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check statistics
        run: |
          set -euo pipefail
          node -e '
          const { humanTrajectory, stats } = require("./tools/human-drag.js");
          let ok = true;
          for (let i = 0; i < 20; i++) {
            const s = stats(humanTrajectory(0, 0, 222));
            if (s.m_cnt < 50 || s.m_cnt > 70) { console.error("m_cnt", s.m_cnt); ok = false; }
            if (s.m_yDspSD < 2) { console.error("m_yDspSD too flat:", s.m_yDspSD); ok = false; }
            if (s.m_str8 > 0.95) { console.error("m_str8 too straight:", s.m_str8); ok = false; }
          }
          if (!ok) process.exit(1);
          console.log("20 trajectories all inside the human band");
          '

  playwright-patch-applies:
    name: playwright android-cache patch applies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch upstream playwright-core
        run: |
          set -euo pipefail
          ver=$(npm view playwright-core version)
          echo "playwright-core $ver" | tee version.txt
          npm pack "playwright-core@$ver" --silent >/dev/null
          tar -xzf playwright-core-*.tgz
      - name: Assert android still throws before the patch
        run: |
          set -euo pipefail
          target=package/lib/serverRegistry.js
          [ -f "$target" ] || target=package/lib/server/registry/index.js
          echo "target=$target" >> "$GITHUB_ENV"
          grep -q "Unsupported platform" "$target"
          echo "upstream still throws on android (expected)"
      - name: Apply sed recipe and verify
        run: |
          set -euo pipefail
          sed -i -f patches/playwright-android-cache.sed "$target"
          node --check "$target"
          grep -q "process.platform === \"android\"\|process.platform === 'android'" "$target"
          echo "android no longer reaches the throw"
      - name: Assert the patch file still matches the pinned 1.64 layout
        run: |
          set -euo pipefail
          rm -rf pinned && mkdir -p pinned/lib
          npm pack "playwright-core@1.64.1" --silent >/dev/null
          tar -xzf playwright-core-1.64.1.tgz -C pinned --strip-components=1
          cd pinned && patch -p1 --dry-run < ../patches/playwright-android-cache-1.64.patch
